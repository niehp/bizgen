# AI Agent 設定：大模型（LLM）の情報はここから取得する。--live は不要。
# モード: mock = オフライン骨格 / live = ローカル vLLM を呼ぶ
llm.mode=mock

# vLLM の OpenAI 互換エンドポイント（ベース URL。/v1/chat/completions は自動付与）
llm.base-url=http://127.0.0.1:8000

# モデル名（vLLM 起動時の --served-model-name と一致させる）
llm.model=Qwen/Qwen2.5-Coder-14B-Instruct

# 共通 md フォルダ（各レベル 1 フォルダ、フォルダ内に複数 md 可）
common.dir=specs/common

# 表構造 md フォルダ（1 ファイル 1 テーブル、ファイル名 = テーブル名）
# _template.md は雛形なので読みません
table.dir=specs/tables
