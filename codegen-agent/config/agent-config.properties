# ============================================================
# bizgen-agent 設定ファイル
# 重要: LLM 接続情報はコマンドライン引数(--live 等)ではなく、すべてこのファイルに記述する。
# 外部送信先はローカルホストのみ。データ外部漏洩を防ぐためリモート URL は指定しないこと。
# ============================================================

# --- ローカル LLM (OpenAI 互換 API) ---
# LM Studio の既定ポートは 1234。Ollama を使う場合は 11434 に変更する。
llm.baseUrl=http://127.0.0.1:1234/v1
llm.chatPath=/chat/completions
# LM Studio の /v1/models が返すモデル ID をそのまま指定する。
# 例: qwen2.5-coder-14b-instruct / lmstudio-community/Qwen2.5-Coder-14B-Instruct-GGUF
llm.model=qwen2.5-coder-14b-instruct
# API キーはローカル LLM では通常空でよい
llm.apiKey=
llm.temperature=0.1
llm.maxTokens=8192
llm.timeoutMs=180000
# 同一プロンプトの再現性を優先するか（決定性重視）
llm.seed=42
# tool_choice: auto / required / none。LM Studio の default tool use では required が効かないことがある。
llm.toolChoice=auto

# --- パス（起動ディレクトリからの相対パス、または絶対パス）---
path.mdRoot=md
# SQL 生成結果の保存先ルート
path.outputRoot=out
# 生成 Java の保存先ルート。機能 md 側では指定しない（設定ファイルが唯一の情報源）。
path.generatedJavaRoot=out/java
# 既存 Java プロジェクトのルート。既有ファイルへのメソッド追加/修正で使用する。
# 実際の二次開発では、対象の既存 Java プロジェクトの src/main/java を指定してください。
path.existingJavaRoot=sample-existing/src/main/java
# 類似コード検索の対象ルート。空なら path.existingJavaRoot を使用する。
# ここに指定されたディレクトリ配下の Java のみを読み、LLM へ渡す。
path.searchJavaRoot=
path.configFile=config/agent-config.properties
# 术语库目录（各 txt/md に「日本語 -> 英語」を 1 行ずつ記載）
path.termRoot=md/term
# API 库目录（1 md = 1 クラス、表形式で既存メソッドシグネチャを列挙）
path.apiRoot=md/api
# feature-gen の出力ルート。この下にパッケージ構造が作られる。
path.featureOutputRoot=output/src/main/java
# 参考資料ルート（要件理解を助ける 4 類の md を配置する）
#   spec/api/*.md       利用可能な API メソッドシグネチャ
#   spec/dict/*.md      术语（日本語 -> 英語）
#   spec/template/*.md  コード / 出力テンプレート
#   spec/example/*.md   機能インスタンス（完成済み機能の例）
# 各ファイル内の {{変数}} はモデルへ渡す前に機能 md の変数で展開される。
path.specRoot=spec

# --- 生成制御（決定論的な側の設定）---
# LLM に渡す表構造の最大数。これを超える場合はエラーとし、暗中に切り捨てない。
gen.maxTables=5
# 類似コード検索: スキャンする Java ファイル数の上限（大きすぎるプロジェクトでの暴走防止）
gen.searchMaxFiles=2000
# 類似コード検索: LLM へ渡すファイル数と総文字数の上限（14B モデルのコンテキスト保護）
gen.maxSimilarFiles=5
gen.maxSimilarCodeChars=12000
# 生成後のコードは必ず人間がレビューする。true の場合、レビュー確認プロンプトを出す。
gen.reviewRequired=true
# 生成 Java の既定インデント（半角スペース数）
gen.indentSize=4
# feature-gen: 機能 md と术语から注入する既存 API の最大件数
gen.apiTopN=8
# feature-gen: 検証違反時に Self-Correction を 1 回だけ行う
gen.selfCorrect=true
# flow-gen: 意味解析が分解する機能ブロックの上限（14B の暴走防止）
gen.maxBlocks=12
# 機能 md 本文とのキーワード一致で自動的に読み込む設計 md の上限。
# 明示参照 (designs:) は常に読み込まれる。0 にすると自動一致を無効化する。
gen.maxAutoDesigns=6
# prompt に注入する spec 資料の合計文字数上限。超過時は黙って切り捨てずエラーとする（14B のコンテキスト保護）。
spec.maxChars=24000

# --- テンプレート一括填充（template-fill）---
# 入力ディレクトリ配下の全ファイルを再帰的に読み、1 ファイルずつ LLM に填充させる。
# 出力は path.templateFillOutputRoot 配下に元の相対ディレクトリ構造を維持して書かれる。
# 入力ルート配下に出力先を置くことは禁止（テンプレートの再取込を防ぐ）。
path.templateFillRoot=
path.templateFillOutputRoot=out/template-fill
# 填充に使う prompt md（md/prompt/ 配下のファイル名）
templateFill.prompt=template-fill
# 一度に処理するテンプレート数の上限
templateFill.maxFiles=50

# --- Agent（マルチターン function tool 実行）---
# 1 回の生成で LLM を呼び出す最大ターン数。超過するとコード側で失敗させる。
agent.maxRounds=8
# tool 呼び出しの総数上限。14B モデルの暴走防止。
agent.maxToolCalls=30
# 同一引数の同一ツールを連続で呼んだ回数の上限。ループ検出に使う。
agent.maxSameCall=3
# Qwen2.5-Coder 等が tool 呼び出しを content のテキストとして出力した場合に、
# 既知の形式だけを structured tool_calls へ復元する。誤検出が気になる場合のみ false にする。
agent.toolCallRecovery=true
