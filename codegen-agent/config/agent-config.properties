# ============================================================
# bizgen-agent 設定ファイル
# 重要: LLM 接続情報はコマンドライン引数(--live 等)ではなく、すべてこのファイルに記述する。
# 外部送信先はローカルホストのみ。データ外部漏洩を防ぐためリモート URL は指定しないこと。
# ============================================================

# --- ローカル LLM (OpenAI 互換 API: Ollama / LM Studio / llama.cpp など) ---
llm.baseUrl=http://127.0.0.1:11434/v1
llm.chatPath=/chat/completions
llm.model=qwen2.5-coder:14b
# API キーはローカル LLM では通常空でよい
llm.apiKey=
llm.temperature=0.1
llm.maxTokens=8192
llm.timeoutMs=180000
# 同一プロンプトの再現性を優先するか（決定性重視）
llm.seed=42

# --- パス（起動ディレクトリからの相対パス、または絶対パス）---
path.mdRoot=md
# SQL 生成結果の保存先ルート
path.outputRoot=out
# 生成 Java の保存先ルート。機能 md 側では指定しない（設定ファイルが唯一の情報源）。
path.generatedJavaRoot=out/java
# 既存 Java プロジェクトのルート。既有ファイルへのメソッド追加/修正で使用する。
# 実際の二次開発では、対象の既存 Java プロジェクトの src/main/java を指定してください。
path.existingJavaRoot=sample-existing/src/main/java
# 類似コード検索の対象ルート。空なら path.existingJavaRoot を使用する。
# ここに指定されたディレクトリ配下の Java のみを読み、LLM へ渡す。
path.searchJavaRoot=
path.configFile=config/agent-config.properties

# --- 生成制御（決定論的な側の設定）---
# LLM に渡す表構造の最大数。これを超える場合はエラーとし、暗中に切り捨てない。
gen.maxTables=5
# 類似コード検索: スキャンする Java ファイル数の上限（大きすぎるプロジェクトでの暴走防止）
gen.searchMaxFiles=2000
# 類似コード検索: LLM へ渡すファイル数と総文字数の上限（14B モデルのコンテキスト保護）
gen.maxSimilarFiles=5
gen.maxSimilarCodeChars=12000
# 生成後のコードは必ず人間がレビューする。true の場合、レビュー確認プロンプトを出す。
gen.reviewRequired=true
# 生成 Java の既定インデント（半角スペース数）
gen.indentSize=4
